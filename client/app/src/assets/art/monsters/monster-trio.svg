<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="怪兽打样三号：三眼团圆怪（蜡笔黄）">
  <!--
    战机英语美术样张 · 怪兽③ trio 三眼怪（案 C 蜡笔绘本）
    圣经：docs/art-style-bible.md §7。滤镜锁参同怪兽①（wobble seed7 / crayon seed8），禁改。
    蛋黄体上文字/五官一律深墨（ke-ink 族，暖棕深墨），禁白字（对比不足，圣经 §2.1）。

    → pixi Graphics 参数（票 11 换装依据）：
      体   g.beginFill(0xf0c05a).drawCircle(0, 0, 44).endFill()
      双角 g.lineStyle({width:3, color:0x7a5a3d, cap:'round'}).moveTo(-16,-40).lineTo(-24,-58)
           g.lineStyle({width:3, color:0x7a5a3d, cap:'round'}).moveTo(16,-40).lineTo(24,-58)
      三眼 beginFill(0xffffff).drawCircle(-15,-12,9) / drawCircle(15,-12,9) / drawCircle(0,6,12)
      瞳孔 beginFill(0x4a3a2a).drawCircle(-13,-10,3.8) / drawCircle(17,-14,3.8) / drawCircle(2,8,5)
      嘴   lineStyle({width:3,color:0x7a5a3d,cap:'round'}).moveTo(-9,28).quadraticCurveTo(0,35,9,28)
      腮红 lineStyle({width:2,color:0xe8764f,cap:'round'}) 短线×2：(±24,16)-(±30,20)
      脚   beginFill(0xf0c05a).drawRoundedRect(-25,38,18,13,6) / drawRoundedRect(7,38,18,13,6)
      全身统一描边：lineStyle({width:3, color:0x7a5a3d, cap:'round', joint:'round'})
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="8" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="230" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)" transform="translate(100,110)">
    <!-- 双角 -->
    <path d="M-16,-40 L-24,-58" stroke="#7A5A3D" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M16,-40 L24,-58" stroke="#7A5A3D" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-24" cy="-60" r="6" fill="#8FBE6E" stroke="#7A5A3D" stroke-width="3"/>
    <circle cx="24" cy="-60" r="6" fill="#8FBE6E" stroke="#7A5A3D" stroke-width="3"/>
    <!-- 团圆体 -->
    <circle cx="0" cy="0" r="44" fill="#F0C05A" opacity="0.9" filter="url(#ke-crayon)" stroke="#7A5A3D" stroke-width="3.5"/>
    <!-- 三眼（上二下一，歪瞳） -->
    <circle cx="-15" cy="-12" r="9" fill="#FFFFFF" stroke="#7A5A3D" stroke-width="2.5"/>
    <circle cx="15" cy="-14" r="9" fill="#FFFFFF" stroke="#7A5A3D" stroke-width="2.5"/>
    <circle cx="0" cy="8" r="12" fill="#FFFFFF" stroke="#7A5A3D" stroke-width="2.5"/>
    <circle cx="-13" cy="-10" r="3.8" fill="#4A3A2A"/>
    <circle cx="17" cy="-16" r="3.8" fill="#4A3A2A"/>
    <circle cx="2" cy="10" r="5" fill="#4A3A2A"/>
    <!-- 嘴＋腮红斜线 -->
    <path d="M-9,28 Q0,35 9,28" stroke="#7A5A3D" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M24,16 l6,4 M-24,18 l-6,4" stroke="#E8764F" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- 脚 -->
    <rect x="-25" y="38" width="18" height="13" rx="6" fill="#F0C05A" stroke="#7A5A3D" stroke-width="3"/>
    <rect x="7" y="38" width="18" height="13" rx="6" fill="#F0C05A" stroke="#7A5A3D" stroke-width="3"/>
  </g>
</svg>
