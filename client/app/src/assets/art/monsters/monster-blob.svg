<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="怪兽打样一号：圆胖双触角怪（蜡笔蓝）">
  <!--
    战机英语美术样张 · 怪兽① blob 圆胖怪（案 C 蜡笔绘本）
    圣经：docs/art-style-bible.md §7（怪兽→pixi Graphics 参数映射）。
    滤镜锁参：wobble(seed7 bf0.035 oct3 scale5) + crayon(seed8 bf0.5 oct2 alpha0.45)，禁改。

    → pixi Graphics 参数（票 11 换装依据；运行时纯色填充＋暖棕描边，颗粒烘贴图）：
      体   g.beginFill(0x5b9bb5).drawEllipse(0, 0, 46, 42).endFill()
      触角 g.lineStyle({width:3, color:0x7a5a3d, cap:'round'}).moveTo(-18,-38).lineTo(-30,-62)
           g.lineStyle({width:3, color:0x7a5a3d, cap:'round'}).moveTo(18,-38).lineTo(30,-62)
           触角球 beginFill(0x356e88).drawCircle(-30,-64,6) / drawCircle(30,-64,6)
      眼白 beginFill(0xffffff).drawCircle(-16,-6,11) / drawCircle(16,-6,11)
      瞳孔 beginFill(0x4a3a2a).drawCircle(-14,-4,4.5) / drawCircle(14,-2,4.5)（歪瞳＝歪萌）
      嘴   lineStyle({width:3,color:0x7a5a3d,cap:'round'}).moveTo(-8,12).quadraticCurveTo(0,20,8,12)
      腮红 lineStyle({width:2,color:0xe8764f,cap:'round'}) 短线×2：(18,6)-(24,10) / (28,4)-(34,8)
      脚   beginFill(0x5b9bb5).drawRoundedRect(-26,36,18,13,6) / drawRoundedRect(8,36,18,13,6)
      全身统一描边：lineStyle({width:3, color:0x7a5a3d, cap:'round', joint:'round'})
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="8" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="230" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)" transform="translate(100,110)">
    <!-- 触角 -->
    <path d="M-18,-38 L-30,-62" stroke="#7A5A3D" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M18,-38 L30,-62" stroke="#7A5A3D" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="-30" cy="-64" r="6" fill="#356E88" stroke="#7A5A3D" stroke-width="3"/>
    <circle cx="30" cy="-64" r="6" fill="#356E88" stroke="#7A5A3D" stroke-width="3"/>
    <!-- 圆胖体 -->
    <ellipse cx="0" cy="0" rx="46" ry="42" fill="#5B9BB5" opacity="0.88" filter="url(#ke-crayon)" stroke="#7A5A3D" stroke-width="3.5"/>
    <!-- 肚皮淡晕 -->
    <ellipse cx="0" cy="20" rx="22" ry="12" fill="#DCEBF1" opacity="0.8"/>
    <!-- 眼（一高一低＋歪瞳） -->
    <circle cx="-16" cy="-6" r="11" fill="#FFFFFF" stroke="#7A5A3D" stroke-width="2.5"/>
    <circle cx="16" cy="-9" r="11" fill="#FFFFFF" stroke="#7A5A3D" stroke-width="2.5"/>
    <circle cx="-14" cy="-4" r="4.5" fill="#4A3A2A"/>
    <circle cx="14" cy="-7" r="4.5" fill="#4A3A2A"/>
    <!-- 嘴＋腮红斜线 -->
    <path d="M-8,12 Q0,20 8,12" stroke="#7A5A3D" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M22,6 l6,4 M32,4 l6,4" stroke="#E8764F" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- 脚 -->
    <rect x="-26" y="36" width="18" height="13" rx="6" fill="#5B9BB5" stroke="#7A5A3D" stroke-width="3"/>
    <rect x="8" y="36" width="18" height="13" rx="6" fill="#5B9BB5" stroke="#7A5A3D" stroke-width="3"/>
  </g>
</svg>
