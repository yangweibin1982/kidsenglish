      <path d="M394,428 Q408,418 412,402" stroke="#7A5A3D" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M394,428 Q408,418 412,402" stroke="#B9844A" stroke-width="10" fill="none" stroke-linecap="round"/>
      <circle cx="332" cy="362" r="10" fill="#B9844A" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="332" cy="362" r="5" fill="#E8A95C"/>
      <circle cx="376" cy="360" r="10" fill="#B9844A" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="376" cy="360" r="5" fill="#E8A95C"/>
      <circle cx="354" cy="386" r="28" fill="#B9844A" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <ellipse cx="354" cy="398" rx="13" ry="10" fill="#F2D6B4" opacity="0.9" stroke="#7A5A3D" stroke-width="2"/>
      <circle cx="354" cy="393" r="3.5" fill="#4A3A2A"/>
      <path d="M348,403 Q354,408 360,403" stroke="#7A5A3D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <circle cx="342" cy="380" r="3" fill="#4A3A2A"/><circle cx="366" cy="380" r="3" fill="#4A3A2A"/>
    </g>

    <!-- panda 熊猫（代表词 panda：黑眼圈黑耳黑肢；四肢单笔深棕留痕偏差） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="560" cy="521" rx="62" ry="8" fill="#7A5A3D" opacity="0.13"/>
      <path d="M538,474 L536,512 M582,474 L584,512" stroke="#4A3A2A" stroke-width="12" stroke-linecap="round"/>
      <rect x="510" y="416" width="100" height="74" rx="32" fill="#FFF9EC" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <ellipse cx="560" cy="452" rx="17" ry="21" fill="#4A3A2A" opacity="0.85"/>
      <path d="M520,434 Q506,454 514,474" stroke="#4A3A2A" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M600,432 Q612,448 604,468" stroke="#4A3A2A" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="538" cy="364" r="9" fill="#4A3A2A"/>
      <circle cx="586" cy="362" r="9" fill="#4A3A2A"/>
      <circle cx="562" cy="386" r="27" fill="#FFF9EC" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <ellipse cx="548" cy="382" rx="8" ry="10" fill="#4A3A2A"/>
      <ellipse cx="576" cy="380" rx="8" ry="10" fill="#4A3A2A"/>
      <circle cx="548" cy="380" r="2.5" fill="#FFF9EC"/><circle cx="576" cy="378" r="2.5" fill="#FFF9EC"/>
      <circle cx="562" cy="396" r="3.5" fill="#4A3A2A"/>
      <path d="M556,402 Q562,407 568,402" stroke="#7A5A3D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- tiger 老虎（代表词 tiger：条纹虎） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="760" cy="521" rx="68" ry="8" fill="#7A5A3D" opacity="0.13"/>
      <rect x="726" y="478" width="15" height="40" rx="7" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="776" y="478" width="15" height="40" rx="7" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M810,462 Q832,454 828,430 Q825,416 814,419" stroke="#7A5A3D" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M810,462 Q832,454 828,430 Q825,416 814,419" stroke="#E8A95C" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M830,440 L821,438 M826,422 L817,424" stroke="#4A3A2A" stroke-width="4" stroke-linecap="round"/>
      <rect x="708" y="414" width="104" height="74" rx="32" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <ellipse cx="762" cy="462" rx="24" ry="18" fill="#FFF9EC" opacity="0.85"/>
      <path d="M738,426 q-2,14 0,26 M762,422 q-2,16 0,30 M786,426 q-2,14 0,26" stroke="#4A3A2A" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M722,430 Q708,452 714,480" stroke="#7A5A3D" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M722,430 Q708,452 714,480" stroke="#E8A95C" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M798,428 Q812,418 816,402" stroke="#7A5A3D" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M798,428 Q812,418 816,402" stroke="#E8A95C" stroke-width="10" fill="none" stroke-linecap="round"/>
      <circle cx="726" cy="362" r="10" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="726" cy="362" r="5" fill="#FFF9EC"/>
      <circle cx="770" cy="360" r="10" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="770" cy="360" r="5" fill="#FFF9EC"/>
      <circle cx="748" cy="384" r="28" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M740,362 L744,354 M748,360 L748,352 M756,362 L752,354" stroke="#4A3A2A" stroke-width="3" stroke-linecap="round"/>
