      <ellipse cx="360" cy="521" rx="66" ry="8" fill="#7A5A3D" opacity="0.13"/>
      <rect x="332" y="478" width="16" height="40" rx="7" fill="#B9844A" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="372" y="478" width="16" height="40" rx="7" fill="#B9844A" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="312" y="412" width="96" height="78" rx="34" fill="#B9844A" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
