      <ellipse cx="165" cy="521" rx="52" ry="7" fill="#7A5A3D" opacity="0.13"/>
      <rect x="146" y="478" width="14" height="40" rx="6" fill="#A9764E" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="172" y="478" width="14" height="40" rx="6" fill="#A9764E" opacity="0.92" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M193,478 Q214,472 212,450 Q210,434 196,440" stroke="#7A5A3D" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M193,478 Q214,472 212,450 Q210,434 196,440" stroke="#A9764E" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="137" y="420" width="58" height="70" rx="24" fill="#A9764E" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <ellipse cx="166" cy="456" rx="17" ry="21" fill="#F2D6B4" opacity="0.9"/>
      <path d="M147,436 Q132,458 137,484" stroke="#7A5A3D" stroke-width="13" fill="none" stroke-linecap="round"/>
