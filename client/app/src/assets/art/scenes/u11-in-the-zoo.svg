    <!-- 地面轻细节两件：石块×2（禁堆砌）＋草叶两组 -->
    <g filter="url(#ke-crayon)">
      <rect x="490" y="496" width="30" height="16" rx="8" fill="#E7DBC2" opacity="0.9" stroke="#7A5A3D" stroke-width="2.2"/>
      <rect x="622" y="504" width="20" height="12" rx="6" fill="#E7DBC2" opacity="0.9" stroke="#7A5A3D" stroke-width="2.2"/>
      <path d="M300,548 q8,-10 16,0 M668,550 q8,-9 16,0" stroke="#5C9968" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- 热点圈：涂改圈柔化版（罩体圈；dasharray 10 8 锁定不动） -->
    <g fill="none" stroke="#7A5A3D" stroke-width="3.5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.2">
      <circle cx="165" cy="428" r="60"/>
      <circle cx="358" cy="424" r="62"/>
      <circle cx="560" cy="426" r="64"/>
      <circle cx="756" cy="424" r="64"/>
    </g>
  </g>

  <!-- 文字层（不参与抖动，圣经 §3.5） -->
  <text x="450" y="42" text-anchor="middle" font-size="27" font-weight="bold" fill="#5A4A38" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">Unit 11 · In the zoo</text>
  <text x="817" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#5A4A38" font-family="system-ui, 'Segoe UI', sans-serif">ZOO</text>
  <g font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="132" y="528" width="66" height="26" rx="13" fill="#7A5A3D"/><text x="165" y="546" fill="#FFF9EC">monkey</text>
    <rect x="328" y="528" width="60" height="26" rx="13" fill="#7A5A3D"/><text x="358" y="546" fill="#FFF9EC">bear</text>
    <rect x="528" y="528" width="64" height="26" rx="13" fill="#7A5A3D"/><text x="560" y="546" fill="#FFF9EC">panda</text>
    <rect x="724" y="528" width="64" height="26" rx="13" fill="#7A5A3D"/><text x="756" y="546" fill="#FFF9EC">tiger</text>
  </g>

  <!-- 全局纸面颗粒（alpha 0.06 锁定） -->
  <rect width="900" height="560" filter="url(#ke-papergrain)"/>
</svg>
