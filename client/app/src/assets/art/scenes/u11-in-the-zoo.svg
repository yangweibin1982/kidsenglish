<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="U11 In the zoo 情景图样张：动物园里的小猴棕熊熊猫和老虎">
  <!--
    战机英语美术样张 · U11「In the zoo」单元情景图（案 C 蜡笔绘本 · 票 20 批量产出）
    参数唯一事实源：docs/art-style-bible.md（§2 色板 / §4 滤镜锁参 / §7.1 人物几何）。
    滤镜：ke-wobble(seed111, bf0.035, oct3, scale5) + ke-crayon(seed211, bf0.5, oct2, alpha0.45)
          + ke-papergrain(seed311, bf0.9, oct2, alpha0.06) —— 参数禁改（圣经 §4），
          seed 按图注册（圣经 §4.4）：wobble 111 / crayon 211 / papergrain 311。
    文字层不参与抖动滤镜（圣经 §3.5）。零外链资产（儿童红线 R18）。
    热点圈＝涂改圈隐喻（dasharray 10 8 暖棕 3.5px，opacity 0.2；动物＝罩体圈，随体型定径）。
    造型注记：四肢沿用票 18 连肩弧线双程描边技法（棕底＋毛色覆面）；唯一偏差＝熊猫
    四肢单笔深棕 #4A3A2A w12（熊猫黑毛特征，留痕登记，非参数漂移）。
    代表词：monkey / bear / panda / tiger。
    热点坐标（内容域票接词包配置用）：monkey=(165,428,60) bear=(358,424,62) panda=(560,426,64) tiger=(756,424,64)
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="111" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="211" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="ke-papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="311"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="560" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)">
    <!-- 天空 + 草地 -->
    <rect x="0" y="0" width="900" height="382" fill="#E3F0F2" opacity="0.5"/>
    <rect x="0" y="375" width="900" height="185" fill="#8FBE6E" opacity="0.28" filter="url(#ke-crayon)"/>
    <path d="M-10,383 Q230,374 470,382 T910,378 L910,570 L-10,570 Z" fill="#8FBE6E" opacity="0.18" filter="url(#ke-crayon)"/>

    <!-- 太阳与云 -->
    <g filter="url(#ke-crayon)">
      <circle cx="105" cy="84" r="25" fill="#F0C05A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <g stroke="#E8B84A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
        <line x1="105" y1="51" x2="104" y2="42"/><line x1="105" y1="117" x2="106" y2="126"/>
        <line x1="72" y1="84" x2="63" y2="85"/><line x1="138" y1="84" x2="147" y2="83"/>
      </g>
      <g fill="#FFF9EC" opacity="0.85">
        <circle cx="456" cy="92" r="14"/><circle cx="478" cy="85" r="18"/><circle cx="500" cy="93" r="13"/>
        <rect x="444" y="90" width="66" height="16" rx="8"/>
      </g>
    </g>

    <!-- 背景树（左·右） -->
    <g filter="url(#ke-crayon)">
      <rect x="64" y="352" width="16" height="96" rx="6" fill="#B9844A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="72" cy="326" r="36" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="46" cy="356" r="24" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="100" cy="356" r="24" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
      <rect x="860" y="356" width="16" height="88" rx="6" fill="#B9844A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="866" cy="332" r="34" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="838" cy="362" r="24" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="892" cy="364" r="22" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
    </g>

    <!-- ZOO 木牌（右中景） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="817" cy="521" rx="24" ry="5" fill="#7A5A3D" opacity="0.13"/>
      <rect x="812" y="424" width="10" height="94" rx="4" fill="#B9844A" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="786" y="388" width="62" height="36" rx="6" fill="#E8A95C" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
