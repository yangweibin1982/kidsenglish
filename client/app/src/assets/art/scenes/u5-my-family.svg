<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="U5 My family 情景图样张：屋前一家五口的全家福">
  <!--
    战机英语美术样张 · U5「My family」单元情景图（案 C 蜡笔绘本 · 票 20 批量产出）
    参数唯一事实源：docs/art-style-bible.md（§2 色板 / §4 滤镜锁参 / §7.1 人物几何）。
    滤镜：ke-wobble(seed105, bf0.035, oct3, scale5) + ke-crayon(seed205, bf0.5, oct2, alpha0.45)
          + ke-papergrain(seed305, bf0.9, oct2, alpha0.06) —— 参数禁改（圣经 §4），
          seed 按图注册（圣经 §4.4）：wobble 105 / crayon 205 / papergrain 305。
    文字层不参与抖动滤镜（圣经 §3.5）。零外链资产（儿童红线 R18）。
    热点圈＝涂改圈隐喻（dasharray 10 8 暖棕 3.5px，opacity 0.2；人物＝头肩小圈 r=头r+18）。
    代表词：grandfather / grandmother / father / mother（前景 me＝叙述者锚点，按 U2 惯例涂改圈名额给长辈词）。
    热点坐标（内容域票接词包配置用）：grandfather=(195,420,49) grandmother=(320,423,48) father=(585,414,52) mother=(700,418,49)
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="105" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="205" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="ke-papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="305"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="560" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)">
    <!-- 天空 + 草地 + 屋前小路 -->
    <rect x="0" y="0" width="900" height="388" fill="#E3F0F2" opacity="0.5"/>
    <rect x="0" y="380" width="900" height="180" fill="#8FBE6E" opacity="0.28" filter="url(#ke-crayon)"/>
    <path d="M-10,390 Q220,380 460,388 T910,384 L910,570 L-10,570 Z" fill="#8FBE6E" opacity="0.18" filter="url(#ke-crayon)"/>
    <path d="M420,388 L480,388 L560,560 L340,560 Z" fill="#E8A95C" opacity="0.38" filter="url(#ke-crayon)"/>

    <!-- 太阳与云 -->
    <g filter="url(#ke-crayon)">
      <circle cx="105" cy="88" r="26" fill="#F0C05A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <g stroke="#E8B84A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
