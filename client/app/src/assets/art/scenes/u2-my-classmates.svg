<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="U2 My classmates 情景图样张：教室里老师和同学们">
  <!--
    战机英语美术样张 · U2「My classmates」单元情景图（案 C 蜡笔绘本）
    参数唯一事实源：docs/art-style-bible.md（圣经 §2 色板 / §4 滤镜锁参）。
    滤镜：ke-wobble(seed7, bf0.035, oct3, scale5) + ke-crayon(seed8, bf0.5, oct2, alpha0.45)
          + ke-papergrain(seed11, bf0.9, oct2, alpha0.06) —— 禁改参（圣经 §4）。
    文字层不参与抖动滤镜（圣经 §3.5 铁律）。零外链资产（儿童红线 R18）。
    热点圈＝涂改圈隐喻（dasharray 10 8 暖棕 3.5px，opacity 0.2，只罩头肩上圈——票 18 两案择优定案）；
    量产时热点坐标归词包配置。几何/构图 v2（票 18）：四角色 Q 版头身比≈1:1.5、连肩弧线手臂、
    全员落地软阴影、三课桌一横排、讲台移位杜绝横杆穿模。人物→pixi 映射见圣经 §7「U2 人物映射」。
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="8" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="ke-papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="560" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)">
    <!-- 墙面淡彩一笔 + 蜡笔地板 -->
    <rect x="0" y="0" width="900" height="400" fill="#E3F0F2" opacity="0.5"/>
    <rect x="0" y="392" width="900" height="178" fill="#E8A95C" opacity="0.45" filter="url(#ke-crayon)"/>
    <path d="M-10,400 Q220,386 460,398 T910,394 L910,570 L-10,570 Z" fill="#D9A05B" opacity="0.5" filter="url(#ke-crayon)"/>
    <!-- 地板蜡笔短线（落在家具间隙） -->
    <path d="M262,516 q28,-4 56,0 M520,540 q26,-4 52,0 M788,502 q30,-4 60,0 M40,548 q24,-4 48,0" stroke="#B9844A" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- 窗（蜡笔框 + 天空淡彩 + 太阳贴纸） -->
    <g filter="url(#ke-crayon)">
      <rect x="620" y="60" width="200" height="150" rx="16" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="3.5"/>
      <rect x="636" y="76" width="168" height="118" rx="10" fill="#A8D3E2" opacity="0.75"/>
      <line x1="720" y1="76" x2="720" y2="194" stroke="#7A5A3D" stroke-width="3"/>
      <line x1="636" y1="135" x2="804" y2="135" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="688" cy="108" r="20" fill="#F0C05A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <g stroke="#E8B84A" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
        <line x1="688" y1="80" x2="687" y2="70"/><line x1="688" y1="136" x2="689" y2="146"/>
        <line x1="660" y1="108" x2="650" y2="109"/><line x1="716" y1="108" x2="726" y2="107"/>
      </g>
    </g>

    <!-- 黑板（暖棕框 + 深墨板面 + 蜡笔字迹线，居中上方） -->
