<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="U9 May I have a pie? 情景图样张：点心吧台上派汉堡披萨蛋糕和小顾客点单">
  <!--
    战机英语美术样张 · U9「May I have a pie?」单元情景图（案 C 蜡笔绘本 · 票 20 批量产出）
    参数唯一事实源：docs/art-style-bible.md（§2 色板 / §4 滤镜锁参 / §7.1 人物几何）。
    滤镜：ke-wobble(seed109, bf0.035, oct3, scale5) + ke-crayon(seed209, bf0.5, oct2, alpha0.45)
          + ke-papergrain(seed309, bf0.9, oct2, alpha0.06) —— 参数禁改（圣经 §4），
          seed 按图注册（圣经 §4.4）：wobble 109 / crayon 209 / papergrain 309。
    文字层不参与抖动滤镜（圣经 §3.5）。零外链资产（儿童红线 R18）。
    热点圈＝涂改圈隐喻（dasharray 10 8 暖棕 3.5px，opacity 0.2；物件＝罩物圈）。
    代表词：pie / hamburger / pizza / cake（摊主与小顾客为场景锚点，不占热点名额）。
    热点坐标（内容域票接词包配置用）：pie=(210,300,42) hamburger=(330,292,40) pizza=(445,300,40) cake=(545,306,40)
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="109" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="209" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="ke-papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="309"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="560" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)">
    <!-- 墙面淡彩 + 蜡笔地板 -->
    <rect x="0" y="0" width="900" height="392" fill="#E3F0F2" opacity="0.38"/>
    <rect x="0" y="392" width="900" height="178" fill="#E8A95C" opacity="0.45" filter="url(#ke-crayon)"/>
    <path d="M-10,400 Q220,386 460,398 T910,394 L910,570 L-10,570 Z" fill="#D9A05B" opacity="0.5" filter="url(#ke-crayon)"/>
    <path d="M60,516 q28,-4 56,0 M620,540 q26,-4 52,0 M840,508 q24,-4 48,0" stroke="#B9844A" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- 彩旗一串（点心吧氛围，非热点） -->
    <g filter="url(#ke-crayon)">
      <path d="M40,70 Q270,96 500,72" stroke="#7A5A3D" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M78,74 L102,74 L90,96 Z" fill="#E8764F" opacity="0.85"/>
      <path d="M178,82 L202,82 L190,104 Z" fill="#5B9BB5" opacity="0.85"/>
      <path d="M278,86 L302,86 L290,108 Z" fill="#F0C05A" opacity="0.85"/>
      <path d="M378,84 L402,84 L390,106 Z" fill="#8FBE6E" opacity="0.85"/>
      <path d="M468,75 L492,75 L480,97 Z" fill="#E8764F" opacity="0.85"/>
    </g>

    <!-- 菜单小黑板（墙上） -->
    <g filter="url(#ke-crayon)">
      <rect x="585" y="66" width="255" height="104" rx="10" fill="#5C6E5A" opacity="0.92" stroke="#7A5A3D" stroke-width="3.5"/>
      <path d="M605,96 q30,-5 60,0 M605,120 q44,-5 88,0 M690,96 q26,-4 52,0" stroke="#FBF3DF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M605,146 q36,-4 72,0" stroke="#F0C05A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- 柜台（箱体落地，脚线 392） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="370" cy="397" rx="235" ry="8" fill="#7A5A3D" opacity="0.12"/>
      <rect x="150" y="330" width="440" height="62" rx="8" fill="#E8A95C" opacity="0.9" stroke="#7A5A3D" stroke-width="3.5"/>
      <line x1="162" y1="361" x2="578" y2="361" stroke="#7A5A3D" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- 台面点心四样 -->
    <g filter="url(#ke-crayon)">
      <!-- 派（代表词 pie：格子酥皮圆派） -->
      <ellipse cx="210" cy="324" rx="46" ry="8" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M168,322 Q168,282 210,280 Q252,282 252,322 Z" fill="#F0C05A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M186,294 L234,310 M186,310 L234,294 M202,284 L218,284" stroke="#D9A05B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <!-- 汉堡（代表词 hamburger：面包胚＋生菜＋肉饼） -->
      <rect x="302" y="314" width="56" height="14" rx="7" fill="#E8A95C" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="304" y="302" width="52" height="12" rx="6" fill="#6E4A2E" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M300,300 q7,-9 14,0 q7,-9 14,0 q7,-9 14,0 q7,-9 14,0" fill="#8FBE6E" opacity="0.85" stroke="#7A5A3D" stroke-width="2.2"/>
      <path d="M302,296 Q302,266 330,264 Q358,266 358,296 Z" fill="#E8A95C" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="318" cy="278" r="1.8" fill="#FFF9EC" opacity="0.9"/>
      <circle cx="330" cy="274" r="1.8" fill="#FFF9EC" opacity="0.9"/>
      <circle cx="342" cy="279" r="1.8" fill="#FFF9EC" opacity="0.9"/>
      <!-- 披萨角（代表词 pizza：芝士三角＋肠粒） -->
      <path d="M420,326 L470,326 L450,276 Q445,268 440,276 Z" fill="#F0C05A" opacity="0.9" stroke="#7A5A3D" stroke-width="3" stroke-linejoin="round"/>
      <path d="M421,324 Q445,334 469,324" stroke="#E8A95C" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9"/>
      <circle cx="440" cy="298" r="5" fill="#D96843" opacity="0.9"/>
      <circle cx="454" cy="310" r="5" fill="#D96843" opacity="0.9"/>
      <circle cx="443" cy="316" r="4.5" fill="#D96843" opacity="0.9"/>
      <!-- 蛋糕（代表词 cake：奶油花边＋樱桃） -->
      <ellipse cx="545" cy="326" rx="38" ry="8" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="517" y="296" width="56" height="30" rx="5" fill="#FBE3D6" opacity="0.95" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M517,302 q7,9 14,0 q7,9 14,0 q7,9 14,0 q7,9 14,0 L573,296 L517,296 Z" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="2.2"/>
      <circle cx="545" cy="288" r="5.5" fill="#D96843" opacity="0.9" stroke="#7A5A3D" stroke-width="2.2"/>
      <path d="M545,283 q2,-5 5,-6" stroke="#7A5A3D" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- vendor 叔叔（右端立位：厨师帽＋围裙，全落地脚线 546） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="690" cy="549" rx="55" ry="8" fill="#7A5A3D" opacity="0.15"/>
      <rect x="674" y="499" width="16" height="38" rx="8" fill="#4A3A2A" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="698" y="499" width="16" height="38" rx="8" fill="#4A3A2A" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="666" y="533" width="26" height="13" rx="6.5" fill="#356E88" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="694" y="533" width="26" height="13" rx="6.5" fill="#356E88" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="657" y="429" width="66" height="78" rx="24" fill="#E8764F" opacity="0.88" stroke="#7A5A3D" stroke-width="3"/>
      <rect x="668" y="445" width="44" height="52" rx="8" fill="#FFF9EC" opacity="0.85" stroke="#7A5A3D" stroke-width="2.2"/>
      <path d="M661,441 Q641,452 624,470" stroke="#7A5A3D" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M661,441 Q641,452 624,470" stroke="#E8764F" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.88"/>
      <path d="M719,441 Q729,468 724,494" stroke="#7A5A3D" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M719,441 Q729,468 724,494" stroke="#E8764F" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.88"/>
      <circle cx="690" cy="399" r="34" fill="#F2D6B4" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M656,399 q3,-38 34,-38 q31,0 34,38 q-9,-17 -34,-17 q-25,0 -34,17 Z" fill="#4A3A2A" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <!-- 厨师帽 -->
      <circle cx="672" cy="366" r="10" fill="#FFF9EC" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="690" cy="360" r="12" fill="#FFF9EC" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="708" cy="366" r="10" fill="#FFF9EC" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="662" y="368" width="56" height="16" rx="6" fill="#FFF9EC" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="679" cy="401" r="3" fill="#4A3A2A"/>
      <circle cx="701" cy="399" r="3" fill="#4A3A2A"/>
      <path d="M682,414 Q690,420 698,412" stroke="#7A5A3D" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M668,408 l6,4 M712,406 l-6,4" stroke="#E8764F" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 小顾客 boy（左侧点单：伸手指柜台，张嘴说 May I...） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="100" cy="549" rx="60" ry="8" fill="#7A5A3D" opacity="0.14"/>
      <rect x="81" y="503" width="14" height="34" rx="7" fill="#6E4A2E" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="105" y="503" width="14" height="34" rx="7" fill="#6E4A2E" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="74" y="533" width="24" height="13" rx="6" fill="#7A5A3D" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="102" y="533" width="24" height="13" rx="6" fill="#7A5A3D" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="74" y="447" width="52" height="64" rx="20" fill="#5B9BB5" opacity="0.88" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M122,458 Q148,450 168,440" stroke="#7A5A3D" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M122,458 Q148,450 168,440" stroke="#5B9BB5" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.88"/>
      <path d="M78,458 Q68,484 73,508" stroke="#7A5A3D" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M78,458 Q68,484 73,508" stroke="#5B9BB5" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.88"/>
      <circle cx="100" cy="423" r="28" fill="#F2D6B4" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M74,423 q2,-32 29,-32 q27,0 29,32 q-6,-12 -16,-13 q-4,-7 -13,-6 q-9,-1 -13,6 q-10,1 -16,13 Z" fill="#4A3A2A" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M84,392 l3,-8 M94,393 l3,-7" stroke="#4A3A2A" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <circle cx="91" cy="425" r="3" fill="#4A3A2A"/>
      <circle cx="111" cy="423" r="3" fill="#4A3A2A"/>
      <ellipse cx="101" cy="438" rx="4.5" ry="6" fill="#4A3A2A" opacity="0.85"/>
      <path d="M80,430 l5,4 M120,428 l-5,4" stroke="#E8764F" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 地面轻细节两件：餐巾纸＋小勺（禁堆砌） -->
    <g filter="url(#ke-crayon)">
      <g transform="rotate(4 622 532)">
        <rect x="604" y="522" width="36" height="20" rx="4" fill="#FFF9EC" stroke="#7A5A3D" stroke-width="2.5" opacity="0.85"/>
      </g>
      <ellipse cx="146" cy="538" rx="6" ry="9" fill="#D9A05B" opacity="0.9" stroke="#7A5A3D" stroke-width="2" transform="rotate(-20 146 538)"/>
      <path d="M152,530 L164,548" stroke="#D9A05B" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- 热点圈：涂改圈柔化版（罩物圈；dasharray 10 8 锁定不动） -->
    <g fill="none" stroke="#7A5A3D" stroke-width="3.5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.2">
      <circle cx="210" cy="300" r="42"/>
      <circle cx="330" cy="292" r="40"/>
      <circle cx="445" cy="300" r="40"/>
      <circle cx="545" cy="306" r="40"/>
    </g>
  </g>

  <!-- 文字层（不参与抖动，圣经 §3.5） -->
  <text x="450" y="42" text-anchor="middle" font-size="27" font-weight="bold" fill="#5A4A38" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">Unit 9 · May I have a pie?</text>
  <g font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="185" y="402" width="50" height="26" rx="13" fill="#7A5A3D"/><text x="210" y="420" fill="#FFF9EC">pie</text>
    <rect x="279" y="402" width="102" height="26" rx="13" fill="#7A5A3D"/><text x="330" y="420" fill="#FFF9EC">hamburger</text>
    <rect x="415" y="402" width="60" height="26" rx="13" fill="#7A5A3D"/><text x="445" y="420" fill="#FFF9EC">pizza</text>
    <rect x="515" y="402" width="60" height="26" rx="13" fill="#7A5A3D"/><text x="545" y="420" fill="#FFF9EC">cake</text>
  </g>

  <!-- 全局纸面颗粒（alpha 0.06 锁定） -->
  <rect width="900" height="560" filter="url(#ke-papergrain)"/>
</svg>
