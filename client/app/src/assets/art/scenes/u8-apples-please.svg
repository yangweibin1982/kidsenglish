<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="U8 Apples, please 情景图样张：水果摊上挥手的摊主和苹果桃子橙子梨">
  <!--
    战机英语美术样张 · U8「Apples, please」单元情景图（案 C 蜡笔绘本 · 票 20 批量产出）
    参数唯一事实源：docs/art-style-bible.md（§2 色板 / §4 滤镜锁参 / §7.1 人物几何）。
    滤镜：ke-wobble(seed108, bf0.035, oct3, scale5) + ke-crayon(seed208, bf0.5, oct2, alpha0.45)
          + ke-papergrain(seed308, bf0.9, oct2, alpha0.06) —— 参数禁改（圣经 §4），
          seed 按图注册（圣经 §4.4）：wobble 108 / crayon 208 / papergrain 308。
    文字层不参与抖动滤镜（圣经 §3.5）。零外链资产（儿童红线 R18）。
    热点圈＝涂改圈隐喻（dasharray 10 8 暖棕 3.5px，opacity 0.2；物件＝罩物圈）。
    代表词：apple / peach / orange / pear（摊主为场景锚点，不占热点名额）。
    热点坐标（内容域票接词包配置用）：apple=(318,291,46) peach=(430,306,38) orange=(515,306,38) pear=(605,291,46)
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="108" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="208" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="ke-papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="308"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="560" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)">
    <!-- 墙面淡彩 + 蜡笔地板 -->
    <rect x="0" y="0" width="900" height="392" fill="#FBE3D6" opacity="0.32"/>
    <rect x="0" y="392" width="900" height="178" fill="#E8A95C" opacity="0.45" filter="url(#ke-crayon)"/>
    <path d="M-10,400 Q220,386 460,398 T910,394 L910,570 L-10,570 Z" fill="#D9A05B" opacity="0.5" filter="url(#ke-crayon)"/>
    <path d="M60,520 q28,-4 56,0 M700,510 q30,-4 60,0 M820,548 q24,-4 48,0" stroke="#B9844A" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- 水果摊：立柱＋条纹遮阳棚 -->
    <g filter="url(#ke-crayon)">
      <rect x="241" y="165" width="10" height="227" rx="5" fill="#7A5A3D" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="641" y="165" width="10" height="227" rx="5" fill="#7A5A3D" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="225" y="118" width="450" height="48" rx="10" fill="#FFF9EC" opacity="0.95" stroke="#7A5A3D" stroke-width="3.5"/>
      <rect x="251" y="122" width="76" height="40" fill="#5B9BB5" opacity="0.75"/>
      <rect x="403" y="122" width="76" height="40" fill="#5B9BB5" opacity="0.75"/>
      <rect x="555" y="122" width="76" height="40" fill="#5B9BB5" opacity="0.75"/>
    </g>

    <!-- 摊主 girl（柜台后挥手：下半身被柜台自然遮挡） -->
    <g filter="url(#ke-crayon)">
      <rect x="431" y="327" width="14" height="34" rx="7" fill="#6E4A2E" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="455" y="327" width="14" height="34" rx="7" fill="#6E4A2E" opacity="0.85" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="424" y="357" width="24" height="13" rx="6" fill="#7A5A3D" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="452" y="357" width="24" height="13" rx="6" fill="#7A5A3D" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="424" y="291" width="52" height="64" rx="20" fill="#8FBE6E" opacity="0.88" stroke="#7A5A3D" stroke-width="3"/>
      <rect x="434" y="305" width="32" height="40" rx="8" fill="#FFF9EC" opacity="0.85" stroke="#7A5A3D" stroke-width="2.2"/>
      <path d="M428,302 Q418,328 423,352" stroke="#7A5A3D" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M428,302 Q418,328 423,352" stroke="#8FBE6E" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.88"/>
      <path d="M472,302 Q492,296 498,272" stroke="#7A5A3D" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M472,302 Q492,296 498,272" stroke="#8FBE6E" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.88"/>
      <ellipse cx="414" cy="268" rx="10" ry="12" fill="#4A3A2A" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <ellipse cx="486" cy="266" rx="10" ry="12" fill="#4A3A2A" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="416" cy="256" r="3" fill="#F0C05A" stroke="#7A5A3D" stroke-width="1.6"/>
      <circle cx="484" cy="254" r="3" fill="#F0C05A" stroke="#7A5A3D" stroke-width="1.6"/>
      <circle cx="450" cy="267" r="28" fill="#F5DCC0" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M424,267 q2,-30 26,-30 q24,0 26,30 q-7,-13 -26,-13 q-19,0 -26,13 Z" fill="#4A3A2A" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="441" cy="269" r="3" fill="#4A3A2A"/>
      <circle cx="461" cy="267" r="3" fill="#4A3A2A"/>
      <path d="M442,280 Q450,286 458,279" stroke="#7A5A3D" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M430,274 l5,4 M470,272 l-5,4" stroke="#E8764F" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 柜台（箱体落地，脚线 392） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="450" cy="397" rx="235" ry="8" fill="#7A5A3D" opacity="0.12"/>
      <rect x="230" y="330" width="440" height="62" rx="8" fill="#E8A95C" opacity="0.9" stroke="#7A5A3D" stroke-width="3.5"/>
      <line x1="242" y1="361" x2="658" y2="361" stroke="#7A5A3D" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- 果盘与果箱（摆上台面） -->
    <g filter="url(#ke-crayon)">
      <!-- 苹果箱（代表词 apple） -->
      <circle cx="292" cy="284" r="15" fill="#D96843" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="322" cy="279" r="16" fill="#D96843" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="350" cy="285" r="14" fill="#D96843" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M322,263 l2,-7 M292,269 l2,-6 M350,271 l2,-6" stroke="#7A5A3D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <rect x="268" y="290" width="100" height="14" rx="5" fill="#D9A05B" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="272" y="302" width="92" height="30" rx="4" fill="#D9A05B" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <!-- 桃子盘（代表词 peach） -->
      <ellipse cx="430" cy="324" rx="36" ry="8" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="430" cy="300" r="21" fill="#F0C05A" opacity="0.9" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M425,284 q-5,10 1,20" stroke="#D9A05B" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
      <ellipse cx="443" cy="282" rx="9" ry="5" fill="#8FBE6E" opacity="0.9" stroke="#7A5A3D" stroke-width="2" transform="rotate(30 443 282)"/>
      <!-- 橙子盘（代表词 orange） -->
      <ellipse cx="515" cy="324" rx="30" ry="7" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="515" cy="302" r="20" fill="#E8A95C" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="508" cy="298" r="1.5" fill="#B9844A" opacity="0.7"/>
      <circle cx="516" cy="305" r="1.5" fill="#B9844A" opacity="0.7"/>
      <circle cx="521" cy="297" r="1.5" fill="#B9844A" opacity="0.7"/>
      <ellipse cx="528" cy="286" rx="8" ry="4.5" fill="#8FBE6E" opacity="0.9" stroke="#7A5A3D" stroke-width="2" transform="rotate(-25 528 286)"/>
      <!-- 梨箱（代表词 pear） -->
      <ellipse cx="585" cy="292" rx="12" ry="15" fill="#8FBE6E" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="585" cy="274" r="8" fill="#8FBE6E" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M585,266 l2,-6" stroke="#7A5A3D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <ellipse cx="622" cy="295" rx="12" ry="15" fill="#8FBE6E" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="622" cy="277" r="8" fill="#8FBE6E" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M622,269 l2,-6" stroke="#7A5A3D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <rect x="552" y="290" width="100" height="14" rx="5" fill="#D9A05B" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
      <rect x="556" y="302" width="92" height="30" rx="4" fill="#D9A05B" opacity="0.95" stroke="#7A5A3D" stroke-width="2.5"/>
    </g>

    <!-- 地面轻细节两件：滚落的苹果＋纸袋（禁堆砌） -->
    <g filter="url(#ke-crayon)">
      <circle cx="740" cy="530" r="15" fill="#D96843" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
      <path d="M740,515 l3,-7" stroke="#7A5A3D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <g transform="rotate(-8 182 520)">
        <rect x="162" y="504" width="40" height="34" rx="4" fill="#FFF9EC" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
        <path d="M162,514 L202,514" stroke="#7A5A3D" stroke-width="2" opacity="0.5"/>
      </g>
    </g>

    <!-- 热点圈：涂改圈柔化版（罩物圈；dasharray 10 8 锁定不动） -->
    <g fill="none" stroke="#7A5A3D" stroke-width="3.5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.2">
      <circle cx="318" cy="291" r="46"/>
      <circle cx="430" cy="306" r="38"/>
      <circle cx="515" cy="306" r="38"/>
      <circle cx="605" cy="291" r="46"/>
    </g>
  </g>

  <!-- 文字层（不参与抖动，圣经 §3.5） -->
  <text x="450" y="42" text-anchor="middle" font-size="27" font-weight="bold" fill="#5A4A38" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">Unit 8 · Apples, please</text>
  <g font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="283" y="402" width="70" height="26" rx="13" fill="#7A5A3D"/><text x="318" y="420" fill="#FFF9EC">apple</text>
    <rect x="395" y="402" width="70" height="26" rx="13" fill="#7A5A3D"/><text x="430" y="420" fill="#FFF9EC">peach</text>
    <rect x="480" y="402" width="70" height="26" rx="13" fill="#7A5A3D"/><text x="515" y="420" fill="#FFF9EC">orange</text>
    <rect x="575" y="402" width="60" height="26" rx="13" fill="#7A5A3D"/><text x="605" y="420" fill="#FFF9EC">pear</text>
  </g>

  <!-- 全局纸面颗粒（alpha 0.06 锁定） -->
  <rect width="900" height="560" filter="url(#ke-papergrain)"/>
</svg>
