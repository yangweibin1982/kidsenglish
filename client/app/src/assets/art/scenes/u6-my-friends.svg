<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="U6 My friends 情景图样张：高矮对比的小伙伴和拉手的好朋友">
  <!--
    战机英语美术样张 · U6「My friends」单元情景图（案 C 蜡笔绘本 · 票 20 批量产出）
    参数唯一事实源：docs/art-style-bible.md（§2 色板 / §4 滤镜锁参 / §7.1 人物几何）。
    滤镜：ke-wobble(seed106, bf0.035, oct3, scale5) + ke-crayon(seed206, bf0.5, oct2, alpha0.45)
          + ke-papergrain(seed306, bf0.9, oct2, alpha0.06) —— 参数禁改（圣经 §4），
          seed 按图注册（圣经 §4.4）：wobble 106 / crayon 206 / papergrain 306。
    文字层不参与抖动滤镜（圣经 §3.5）。零外链资产（儿童红线 R18）。
    热点圈＝涂改圈隐喻（dasharray 10 8 暖棕 3.5px，opacity 0.2；人物＝头肩小圈；
    好朋友双人＝同心双头肩大椭圆，语义「两人共一词」——量产标注在此备案）。
    代表词：tall / short / friend。
    热点坐标（内容域票接词包配置用）：tall=(275,414,46) short=(395,452,44) friend=(657,425,ellipse rx118 ry62)
  -->
  <defs>
    <filter id="ke-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="106" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="5"/>
    </filter>
    <filter id="ke-crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="206" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0.45 0" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="grain"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="ke-papergrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="306"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.06 0"/>
    </filter>
  </defs>

  <!-- 纸底 -->
  <rect width="900" height="560" fill="#FBF3DF"/>

  <g filter="url(#ke-wobble)">
    <!-- 天空 + 草地（操场） -->
    <rect x="0" y="0" width="900" height="385" fill="#E3F0F2" opacity="0.5"/>
    <rect x="0" y="378" width="900" height="182" fill="#8FBE6E" opacity="0.28" filter="url(#ke-crayon)"/>
    <path d="M-10,388 Q220,378 460,386 T910,382 L910,570 L-10,570 Z" fill="#8FBE6E" opacity="0.18" filter="url(#ke-crayon)"/>

    <!-- 云两朵 -->
