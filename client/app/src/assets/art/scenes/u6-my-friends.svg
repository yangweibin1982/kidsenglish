      <circle cx="430" cy="76" r="15"/><circle cx="452" cy="70" r="19"/><circle cx="474" cy="78" r="14"/>
      <rect x="418" y="74" width="68" height="17" rx="8.5"/>
      <circle cx="680" cy="60" r="13"/><circle cx="700" cy="55" r="16"/><circle cx="719" cy="62" r="12"/>
      <rect x="670" y="59" width="60" height="15" rx="7.5"/>
    </g>

    <!-- 树两棵（场景装饰） -->
    <g filter="url(#ke-crayon)">
      <ellipse cx="100" cy="492" rx="40" ry="7" fill="#7A5A3D" opacity="0.12"/>
      <rect x="89" y="395" width="22" height="92" rx="9" fill="#7A5A3D" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
