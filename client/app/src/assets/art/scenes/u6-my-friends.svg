      <circle cx="634" cy="410" r="3" fill="#F0C05A" stroke="#7A5A3D" stroke-width="1.6"/>
      <circle cx="600" cy="423" r="28" fill="#EED3B3" opacity="0.92" stroke="#7A5A3D" stroke-width="3"/>
      <path d="M576,423 q2,-30 26,-30 q24,0 26,30 q-7,-13 -26,-13 q-19,0 -26,13 Z" fill="#6E4A2E" opacity="0.9" stroke="#7A5A3D" stroke-width="2.5"/>
