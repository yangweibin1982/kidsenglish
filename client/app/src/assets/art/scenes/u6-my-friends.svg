      <rect x="855" y="400" width="20" height="88" rx="8" fill="#7A5A3D" opacity="0.85" stroke="#7A5A3D" stroke-width="3"/>
      <circle cx="865" cy="340" r="38" fill="#8FBE6E" opacity="0.8" stroke="#7A5A3D" stroke-width="2.5"/>
      <circle cx="834" cy="370" r="25" fill="#8FBE6E" opacity="0.72"/>
      <circle cx="896" cy="370" r="25" fill="#8FBE6E" opacity="0.72"/>
